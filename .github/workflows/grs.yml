name: Update README cards

on:
  schedule:
    - cron: "*/30 * * * *"
    # Run the more expensive contribution analysis once a day (09:17 KST).
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HAS_METRICS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mw48795472&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Keep the existing card working until organization access is configured.
      - name: Generate top languages card (personal repositories fallback)
        if: env.HAS_METRICS_TOKEN != 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=mw48795472&layout=compact&langs_count=6&exclude_repo=Tour-Navigator-App
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages from personal and organization contributions
        id: lowlighter_metrics
        if: >-
          env.HAS_METRICS_TOKEN == 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *')
        continue-on-error: true
        env:
          INPUT_TOKEN: ${{ secrets.METRICS_TOKEN }}
          INPUT_USER: mw48795472
          INPUT_FILENAME: top-langs.svg
          INPUT_OUTPUT_ACTION: none
          INPUT_BASE: ""
          INPUT_CONFIG_TIMEZONE: Asia/Seoul
          # Indepth mode also includes contributed repositories.
          INPUT_REPOSITORIES_AFFILIATIONS: owner
          INPUT_COMMITS_AUTHORING: ${{ vars.METRICS_COMMIT_AUTHORS || 'mw48795472' }}
          INPUT_PLUGIN_LANGUAGES: "yes"
          INPUT_PLUGIN_LANGUAGES_INDEPTH: "yes"
          INPUT_PLUGIN_LANGUAGES_SECTIONS: most-used
          INPUT_PLUGIN_LANGUAGES_DETAILS: percentage
          INPUT_PLUGIN_LANGUAGES_LIMIT: "6"
          INPUT_PLUGIN_LANGUAGES_SKIPPED: Tour-Navigator-App
          INPUT_PLUGIN_LANGUAGES_INDEPTH_CUSTOM: ${{ vars.LANGUAGE_REPOSITORIES }}
          INPUT_PLUGIN_LANGUAGES_ANALYSIS_TIMEOUT: "60"
          INPUT_PLUGIN_LANGUAGES_ANALYSIS_TIMEOUT_REPOSITORIES: "0"
          INPUT_DEBUG: "yes"
          INPUT_PLUGINS_ERRORS_FATAL: "yes"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metrics-renders"
          # Keep the token in the environment, outside command arguments and clone URLs.
          # Authentication is limited to github.com and the disposable container.
          docker run --init --rm -i \
            --volume "$GITHUB_EVENT_PATH:$GITHUB_EVENT_PATH:ro" \
            --volume "$RUNNER_TEMP/metrics-renders:/renders" \
            --env GITHUB_ACTIONS --env GITHUB_REPOSITORY --env GITHUB_ACTOR \
            --env GITHUB_EVENT_NAME --env GITHUB_EVENT_PATH \
            --env GITHUB_RUN_ID --env GITHUB_RUN_NUMBER \
            --env INPUT_TOKEN --env INPUT_USER --env INPUT_FILENAME \
            --env INPUT_OUTPUT_ACTION --env INPUT_BASE --env INPUT_CONFIG_TIMEZONE \
            --env INPUT_REPOSITORIES_AFFILIATIONS --env INPUT_COMMITS_AUTHORING \
            --env INPUT_PLUGIN_LANGUAGES --env INPUT_PLUGIN_LANGUAGES_INDEPTH \
            --env INPUT_PLUGIN_LANGUAGES_SECTIONS --env INPUT_PLUGIN_LANGUAGES_DETAILS \
            --env INPUT_PLUGIN_LANGUAGES_LIMIT --env INPUT_PLUGIN_LANGUAGES_SKIPPED \
            --env INPUT_PLUGIN_LANGUAGES_INDEPTH_CUSTOM \
            --env INPUT_PLUGIN_LANGUAGES_ANALYSIS_TIMEOUT \
            --env INPUT_PLUGIN_LANGUAGES_ANALYSIS_TIMEOUT_REPOSITORIES \
            --env INPUT_DEBUG --env INPUT_PLUGINS_ERRORS_FATAL \
            --env GIT_TERMINAL_PROMPT=0 \
            --env 'GIT_CONFIG_VALUE_0=!f() { if [ "$1" = get ]; then printf "username=mw48795472\npassword=%s\n" "$INPUT_TOKEN"; fi; }; f' \
            --entrypoint node ghcr.io/lowlighter/metrics:v3.34 \
            --input-type=module <<'METRICS_LAUNCHER'
          import {execFileSync} from "node:child_process";
          import {createRequire} from "node:module";
          const require = createRequire(import.meta.url);
          const linguistPath = "/metrics/node_modules/linguist-js/dist/index.js";
          import {readFileSync, writeFileSync} from "node:fs";
          let classifierSource = readFileSync(linguistPath, "utf8");
          const classifierMarker = "for (const file in fileAssociations) {";
          if (!classifierSource.includes(classifierMarker)) throw new Error("Unsupported Linguist classifier");
          classifierSource = classifierSource.replace(classifierMarker, classifierMarker + '\n console.log("Linguist classify: " + file.split("/").pop());');
          classifierSource = classifierSource.replace("// Skip specified categories", 'console.log("Linguist classification phase complete");\n // Skip specified categories');
          writeFileSync(linguistPath, classifierSource);
          const pcreModule = require("/metrics/node_modules/linguist-js/dist/helpers/convert-pcre.js");
          const originalPcre = pcreModule.default;
          pcreModule.default = function(pattern) {
            console.log("Linguist regex: " + pattern);
            const regex = originalPcre(pattern);
            return {test(content) {const result = regex.test(content); console.log("Linguist regex complete"); return result;}};
          };
          const originalLinguist = require(linguistPath);
          require.cache[require.resolve(linguistPath)].exports = async function(...args) {
            const result = await originalLinguist(...args);
            console.log("Linguist classification completed: " + Object.keys(result.files.results).length + " files");
            return result;
          };
          const {IndepthAnalyzer} = await import("/metrics/source/plugins/languages/analyzer/indepth.mjs");
          console.log("Linguist version: " + require("/metrics/node_modules/linguist-js/package.json").version);
          
          
          // Normalize the secret exactly as the original action input reader does.
          const token = (process.env.INPUT_TOKEN || "").trim();
          if (!token) throw new Error("METRICS_TOKEN is empty");
          process.env.INPUT_TOKEN = token;
          const apiHeaders = {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"};
          const identityResponse = await fetch("https://api.github.com/user", {headers: apiHeaders});
          if (!identityResponse.ok) throw new Error("METRICS_TOKEN API authentication failed (HTTP " + identityResponse.status + ")");
          const identity = await identityResponse.json();
          if (identity.login !== "mw48795472") throw new Error("METRICS_TOKEN belongs to a different account");
          const repositoryResponse = await fetch("https://api.github.com/repos/TourLabOrganization/Adroid-App", {headers: apiHeaders});
          if (!repositoryResponse.ok) throw new Error("Adroid-App API access failed (HTTP " + repositoryResponse.status + ")");
          console.log("::notice::METRICS_TOKEN API identity and Adroid-App access verified.");
          
          // Pass authentication directly to Git HTTPS without placing it in URLs or arguments.
          const gitAuth = Buffer.from("mw48795472:" + token).toString("base64");
          console.log("::add-mask::" + gitAuth);
          // Clear inherited headers before setting the one authorized token.
          process.env.GIT_CONFIG_COUNT = "2";
          process.env.GIT_CONFIG_KEY_0 = "http.https://github.com/.extraheader";
          process.env.GIT_CONFIG_VALUE_0 = "";
          process.env.GIT_CONFIG_KEY_1 = "http.https://github.com/.extraheader";
          process.env.GIT_CONFIG_VALUE_1 = "AUTHORIZATION: basic " + gitAuth;
          
          // Check Git authentication before starting the longer language analysis.
          execFileSync("git", ["ls-remote", "https://github.com/TourLabOrganization/Adroid-App.git", "HEAD"], {stdio: ["ignore", "ignore", "inherit"]});
          console.log("::notice::Authenticated Git access to Adroid-App succeeded.");
          
          // Include the owner's Claude-assisted commits only in this explicitly approved repository.
          const originalFilter = IndepthAnalyzer.prototype.filter;
          if (typeof originalFilter !== "function") throw new Error("Unsupported Metrics analyzer");
          IndepthAnalyzer.prototype.filter = async function(path, options) {
            const isApp = path === this.parse("TourLabOrganization/Adroid-App").path;
            const originalAuthors = this.authoring;
            if (isApp) this.authoring = [...new Set([...originalAuthors, "^claude <"])];
            try {
              const commits = await originalFilter.call(this, path, options);
              if (isApp) console.log("::notice::Adroid-App selected " + commits.length + " unique non-merge commits (owner and Claude-assisted work).");
              return commits;
            } finally {
              this.authoring = originalAuthors;
            }
          };
          // Bound first-line detection so large single-line assets cannot exhaust V8.
          // Full file sizes and commit additions are still counted by the original analyzer.
          const {open, readFile: readWholeFile} = await import("node:fs/promises");
          const linguistReader = require("/metrics/node_modules/linguist-js/dist/helpers/read-file.js");
          if (typeof linguistReader.default !== "function") throw new Error("Unsupported Linguist reader");
          linguistReader.default = async function(filename, onlyFirstLine = false) {
            if (!onlyFirstLine) return readWholeFile(filename, "utf8");
            const file = await open(filename, "r");
            try {
              const buffer = Buffer.alloc(64 * 1024);
              const {bytesRead} = await file.read(buffer, 0, buffer.length, 0);
              return buffer.subarray(0, bytesRead).toString("utf8").split(/\r?\n/, 1)[0];
            } finally {
              await file.close();
            }
          };
          
          // Analyze the requested private app first and report bounded diagnostic phases.
          const originalRun = IndepthAnalyzer.prototype.run;
          IndepthAnalyzer.prototype.run = function(options) {
            const repositories = [...options.repositories];
            repositories.sort((a, b) => Number(this.parse(b).repo === "TourLabOrganization/Adroid-App") - Number(this.parse(a).repo === "TourLabOrganization/Adroid-App"));
            return originalRun.call(this, {...options, repositories});
          };
          let appScanActive = false;
          const walkModule = require("/metrics/node_modules/linguist-js/dist/helpers/walk-tree.js");
          const originalWalk = walkModule.default;
          walkModule.default = function(data) {
            if (appScanActive) console.log("App language scan: enumerate files");
            const result = originalWalk(data);
            if (appScanActive) console.log("App language scan: enumerated " + result.files.length + " files and " + result.folders.length + " folders");
            return result;
          };
          const boundedRead = linguistReader.default;
          linguistReader.default = async function(filename, firstLine) {
            if (appScanActive) console.log("App language scan: " + (firstLine ? "first line" : "full read") + " " + filename.split("/").pop());
            const result = await boundedRead(filename, firstLine);
            if (appScanActive) console.log("App language scan: read " + result.length + " characters");
            return result;
          };
          
          // Report the app's actual contribution delta after its complete analysis.
          const originalAnalyze = IndepthAnalyzer.prototype.analyze;
          IndepthAnalyzer.prototype.analyze = async function(path, options) {
            const isApp = path === this.parse("TourLabOrganization/Adroid-App").path;
            const before = isApp ? {commits: this.results.commits, missed: this.results.missed.commits, stats: {...this.results.stats}, lines: {...this.results.lines}} : null;
            appScanActive = isApp;
            const result = await originalAnalyze.call(this, path, options);
            appScanActive = false;
            if (isApp) {
              const commits = this.results.commits - before.commits;
              const missed = this.results.missed.commits - before.missed;
              const dartBytes = (this.results.stats.Dart || 0) - (before.stats.Dart || 0);
              const dartLines = (this.results.lines.Dart || 0) - (before.lines.Dart || 0);
              console.log("::notice::Adroid-App analyzed " + commits + " commits; skipped " + missed + "; Dart additions: " + dartLines + " lines, " + dartBytes + " bytes.");
              if (!commits || missed || !dartBytes) throw new Error("Adroid-App analysis is incomplete");
            }
            return result;
          };
          
          // Match the official action's defaults and URI-encoded input handling.
          const {readFile} = await import("node:fs/promises");
          const {default: yaml} = await import("/metrics/node_modules/js-yaml/index.js");
          const {inputs: actionInputs} = yaml.load(await readFile("/metrics/action.yml", "utf8"));
          for (const [name, input] of Object.entries(actionInputs)) {
            const key = "INPUT_" + name.toUpperCase();
            const value = process.env[key] ?? (name === "committer_token" ? "" : input.default ?? "");
            process.env[key] = encodeURIComponent(String(value));
          }
          await import("/metrics/source/app/action/index.mjs");
          METRICS_LAUNCHER

      - name: Install contribution languages card
        if: steps.lowlighter_metrics.outcome == 'success'
        run: |
          test -s "$RUNNER_TEMP/metrics-renders/top-langs.svg"
          cp "$RUNNER_TEMP/metrics-renders/top-langs.svg" profile/top-langs.svg

      - name: Report contribution analysis failure
        if: steps.lowlighter_metrics.outcome == 'failure'
        run: echo "::warning::Language analysis failed. Keeping the previous card. Check METRICS_TOKEN access and the analysis logs."

      - name: Explain personal repositories fallback
        if: >-
          env.HAS_METRICS_TOKEN != 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *')
        run: echo "::notice::Set the METRICS_TOKEN Actions secret to enable organization contribution languages. Until then, the card includes personal repositories only."

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: profile/pin-stats-organization-github-readme-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update README cards"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
