name: Update README cards

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/grs.yml
  schedule:
    - cron: "*/30 * * * *"
    # Run the more expensive contribution analysis once a day (09:17 KST).
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HAS_METRICS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v6

      # The token only has to be valid. Organization repositories it cannot read are
      # excluded from this run instead of blocking every card.
      - name: Check METRICS_TOKEN and organization repository access
        id: metrics_access
        continue-on-error: true
        if: env.HAS_METRICS_TOKEN == 'true'
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          LANGUAGE_REPOSITORIES: ${{ vars.LANGUAGE_REPOSITORIES }}
        run: |
          node --input-type=module <<'CHECK_REPOSITORY_ACCESS'
          import {appendFileSync} from "node:fs";
          const token = process.env.METRICS_TOKEN.trim();
          const headers = {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"};
          const identityResponse = await fetch("https://api.github.com/user", {headers});
          if (!identityResponse.ok) throw new Error("METRICS_TOKEN authentication failed (HTTP " + identityResponse.status + ")");
          if ((await identityResponse.json()).login !== "mw48795472") throw new Error("METRICS_TOKEN belongs to a different account");
          const repositories = [
            "TourLabOrganization/Adroid-App", "TourLabOrganization/frontend", "TourLabOrganization/data-server",
            "TourLabOrganization/Data-Analytics", "TourLabOrganization/Tour-Navigator-App",
            "OREUM-IT/jeju-tour", "OREUM-IT/jeju-tour-flutter",
          ];
          // Repositories added explicitly to the language analysis when they are readable.
          const explicit = ["TourLabOrganization/Tour-Navigator-App", "OREUM-IT/jeju-tour", "OREUM-IT/jeju-tour-flutter"];
          const accessible = [];
          for (const repository of repositories) {
            const response = await fetch("https://api.github.com/repos/" + repository, {headers});
            if (response.ok) accessible.push(repository);
            else console.log("::warning::METRICS_TOKEN cannot access " + repository + " (HTTP " + response.status + "). It is excluded from this run.");
          }
          // Repositories from the LANGUAGE_REPOSITORIES variable are passed through unchanged.
          const extra = (process.env.LANGUAGE_REPOSITORIES || "").split(",").map(repository => repository.trim()).filter(Boolean);
          const custom = [...explicit.filter(repository => accessible.includes(repository)), ...extra];
          if (/[\r\n]/.test(custom.join(""))) throw new Error("LANGUAGE_REPOSITORIES must be a single line");
          appendFileSync(process.env.GITHUB_OUTPUT,
            "repositories=" + accessible.join(",") + "\n" +
            "custom=" + custom.join(", ") + "\n");
          console.log("::notice::METRICS_TOKEN can read " + accessible.length + " of " + repositories.length + " organization repositories.");
          CHECK_REPOSITORY_ACCESS

      - name: Explain unavailable organization token
        if: steps.metrics_access.outcome != 'success'
        run: echo "::warning::METRICS_TOKEN is missing, invalid or belongs to another account. Updating the GitHub Stats card from public activity and keeping the previous organization language card until the token is renewed."

      # One account-wide query includes accessible personal and organization activity.
      # Do not add organization snapshots: public contributions are already in these totals.
      - name: Generate stats card
        id: stats_card
        if: steps.metrics_access.outcome == 'success'
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mw48795472&show_icons=true&number_format=long
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true

      # Keep the card updating from public activity when the token cannot be used.
      - name: Generate stats card (public activity fallback)
        if: steps.stats_card.outcome != 'success'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mw48795472&show_icons=true&number_format=long
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Publish the fast stats update before the longer language analysis.
      - name: Commit statistics cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update unified GitHub stats"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      # Keep the existing card working until organization access is configured.
      - name: Generate top languages card (personal repositories fallback)
        if: env.HAS_METRICS_TOKEN != 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=mw48795472&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages from personal and organization contributions
        id: lowlighter_metrics
        if: >-
          steps.metrics_access.outcome == 'success' &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 0 * * *')
        continue-on-error: true
        env:
          INPUT_TOKEN: ${{ secrets.METRICS_TOKEN }}
          INPUT_USER: mw48795472
          INPUT_FILENAME: top-langs.svg
          INPUT_OUTPUT_ACTION: none
          INPUT_BASE: ""
          INPUT_CONFIG_TIMEZONE: Asia/Seoul
          # Indepth mode also includes contributed repositories.
          INPUT_REPOSITORIES_AFFILIATIONS: owner
          INPUT_COMMITS_AUTHORING: ${{ vars.METRICS_COMMIT_AUTHORS || 'mw48795472' }}
          INPUT_PLUGIN_LANGUAGES: "yes"
          INPUT_PLUGIN_LANGUAGES_INDEPTH: "yes"
          INPUT_PLUGIN_LANGUAGES_SECTIONS: most-used
          INPUT_PLUGIN_LANGUAGES_DETAILS: percentage
          INPUT_PLUGIN_LANGUAGES_LIMIT: "6"
          INPUT_PLUGIN_LANGUAGES_SKIPPED: ""
          # Readable explicit repositories plus LANGUAGE_REPOSITORIES, from the access check above.
          INPUT_PLUGIN_LANGUAGES_INDEPTH_CUSTOM: ${{ steps.metrics_access.outputs.custom }}
          ACCESSIBLE_REPOSITORIES: ${{ steps.metrics_access.outputs.repositories }}
          INPUT_PLUGIN_LANGUAGES_ANALYSIS_TIMEOUT: "60"
          INPUT_PLUGIN_LANGUAGES_ANALYSIS_TIMEOUT_REPOSITORIES: "0"
          INPUT_DEBUG: "yes"
          INPUT_PLUGINS_ERRORS_FATAL: "yes"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metrics-renders"
          # Keep the token in the environment, outside command arguments and clone URLs.
          # Authentication is limited to github.com and the disposable container.
          docker run --init --rm -i \
            --volume "$GITHUB_EVENT_PATH:$GITHUB_EVENT_PATH:ro" \
            --volume "$RUNNER_TEMP/metrics-renders:/renders" \
            --env GITHUB_ACTIONS --env GITHUB_REPOSITORY --env GITHUB_ACTOR \
            --env GITHUB_EVENT_NAME --env GITHUB_EVENT_PATH \
            --env GITHUB_RUN_ID --env GITHUB_RUN_NUMBER \
            --env INPUT_TOKEN --env INPUT_USER --env INPUT_FILENAME \
            --env INPUT_OUTPUT_ACTION --env INPUT_BASE --env INPUT_CONFIG_TIMEZONE \
            --env INPUT_REPOSITORIES_AFFILIATIONS --env INPUT_COMMITS_AUTHORING \
            --env INPUT_PLUGIN_LANGUAGES --env INPUT_PLUGIN_LANGUAGES_INDEPTH \
            --env INPUT_PLUGIN_LANGUAGES_SECTIONS --env INPUT_PLUGIN_LANGUAGES_DETAILS \
            --env INPUT_PLUGIN_LANGUAGES_LIMIT --env INPUT_PLUGIN_LANGUAGES_SKIPPED \
            --env INPUT_PLUGIN_LANGUAGES_INDEPTH_CUSTOM --env ACCESSIBLE_REPOSITORIES \
            --env INPUT_PLUGIN_LANGUAGES_ANALYSIS_TIMEOUT \
            --env INPUT_PLUGIN_LANGUAGES_ANALYSIS_TIMEOUT_REPOSITORIES \
            --env INPUT_DEBUG --env INPUT_PLUGINS_ERRORS_FATAL \
            --env GIT_TERMINAL_PROMPT=0 \
            --env 'GIT_CONFIG_VALUE_0=!f() { if [ "$1" = get ]; then printf "username=mw48795472\npassword=%s\n" "$INPUT_TOKEN"; fi; }; f' \
            --entrypoint node ghcr.io/lowlighter/metrics:v3.34 \
            --input-type=module <<'METRICS_LAUNCHER'
          import {execFileSync} from "node:child_process";
          import {createRequire} from "node:module";
          import {readFileSync, writeFileSync} from "node:fs";
          const require = createRequire(import.meta.url);
          // Report the failure reason as an annotation, so it is visible without opening the logs.
          const recentErrors = [];
          const rememberError = (...values) => {
            recentErrors.push(values.map(value => value instanceof Error ? (value.stack || value.message) : String(value)).join(" "));
            if (recentErrors.length > 3) recentErrors.shift();
          };
          const originalConsoleError = console.error;
          console.error = (...values) => { rememberError(...values); originalConsoleError(...values); };
          process.on("uncaughtExceptionMonitor", error => rememberError(error));
          process.on("exit", code => {
            if (code) console.log("::error::Language analysis failed: " + (recentErrors.join(" | ").replace(/\s+/g, " ").slice(0, 700) || "no error output was captured"));
          });
          // Backport the upstream protobuf reader bounds check to Metrics' bundled dependency.
          // https://github.com/gjtorikian/isBinaryFile/blob/main/src/index.ts
          const binaryPath = require.resolve("/metrics/node_modules/isbinaryfile");
          let binarySource = readFileSync(binaryPath, "utf8");
          const readerMethod = /(next\(len\)\s*\{|Reader\.prototype\.next\s*=\s*function\s*\(len\)\s*\{)/g;
          if ([...binarySource.matchAll(readerMethod)].length !== 1) throw new Error("Unsupported binary reader");
          binarySource = binarySource.replace(readerMethod, '$1\n if (!Number.isSafeInteger(len) || len < 0 || len > this.size - this.offset) { this.error = true; return []; }');
          binarySource += '\n{ const reader = new Reader(Buffer.from([1, 2, 3, 4]), 4); if (reader.next(2).join() !== "1,2" || reader.next(2147483647).length !== 0 || !reader.hasError()) throw new Error("Binary reader bounds check failed"); }\n';
          writeFileSync(binaryPath, binarySource);
          require(binaryPath);
          console.log("::notice::Binary reader bounds check verified.");
          // Analyze tracked source in data-server without the bundled exclusion filters.
          // This is scoped to the approved repository; contribution author filters still apply.
          const indepthPath = "/metrics/source/plugins/languages/analyzer/indepth.mjs";
          let indepthSource = readFileSync(indepthPath, "utf8");
          const linguistCall = "await linguist(path)";
          if (indepthSource.split(linguistCall).length !== 2) throw new Error("Unsupported Linguist call site");
          indepthSource = indepthSource.replace(linguistCall, 'await linguist(path, path.endsWith("-TourLabOrganization_data_server") ? {keepVendored: true, checkIgnored: false} : {})');
          writeFileSync(indepthPath, indepthSource);
          const {IndepthAnalyzer} = await import("/metrics/source/plugins/languages/analyzer/indepth.mjs");
          
          // Normalize the secret exactly as the original action input reader does.
          const token = (process.env.INPUT_TOKEN || "").trim();
          if (!token) throw new Error("METRICS_TOKEN is empty");
          process.env.INPUT_TOKEN = token;
          const apiHeaders = {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"};
          const identityResponse = await fetch("https://api.github.com/user", {headers: apiHeaders});
          if (!identityResponse.ok) throw new Error("METRICS_TOKEN API authentication failed (HTTP " + identityResponse.status + ")");
          const identity = await identityResponse.json();
          if (identity.login !== "mw48795472") throw new Error("METRICS_TOKEN belongs to a different account");
          // Repositories the token could read in the access check; the others are excluded from this run.
          const accessible = (process.env.ACCESSIBLE_REPOSITORIES || "").split(",").filter(Boolean);
          const readable = repositories => repositories.filter(repository => accessible.includes(repository));
          console.log("::notice::METRICS_TOKEN API identity verified. Readable organization repositories: " + (accessible.join(", ") || "none") + ".");

          // Pass authentication directly to Git HTTPS without placing it in URLs or arguments.
          const gitAuth = Buffer.from("mw48795472:" + token).toString("base64");
          console.log("::add-mask::" + gitAuth);
          // Clear inherited headers before setting the one authorized token.
          process.env.GIT_CONFIG_COUNT = "2";
          process.env.GIT_CONFIG_KEY_0 = "http.https://github.com/.extraheader";
          process.env.GIT_CONFIG_VALUE_0 = "";
          process.env.GIT_CONFIG_KEY_1 = "http.https://github.com/.extraheader";
          process.env.GIT_CONFIG_VALUE_1 = "AUTHORIZATION: basic " + gitAuth;
          
          // Check Git authentication before starting the longer language analysis.
          if (accessible.length) {
            execFileSync("git", ["ls-remote", "https://github.com/" + accessible[0] + ".git", "HEAD"], {stdio: ["ignore", "ignore", "inherit"]});
            console.log("::notice::Authenticated Git access to " + accessible[0] + " succeeded.");
          }

          // Include the owner's Claude-assisted work only in the three approved repositories.
          // Every list is limited to repositories the token can read.
          const claudeRepositories = readable(["TourLabOrganization/Adroid-App", "TourLabOrganization/frontend", "TourLabOrganization/data-server"]);
          const oreumRepositories = readable(["OREUM-IT/jeju-tour", "OREUM-IT/jeju-tour-flutter"]);
          const requiredRepositories = [...readable(["TourLabOrganization/Tour-Navigator-App"]), ...oreumRepositories];
          const reportedRepositories = [...claudeRepositories, ...readable(["TourLabOrganization/Data-Analytics"]), ...requiredRepositories];
          const selectedContributions = new Map();
          const originalFilter = IndepthAnalyzer.prototype.filter;
          if (typeof originalFilter !== "function") throw new Error("Unsupported Metrics analyzer");
          IndepthAnalyzer.prototype.filter = async function(path, options) {
            const repository = reportedRepositories.find(repo => path === this.parse(repo).path);
            const originalAuthors = this.authoring;
            if (claudeRepositories.includes(repository)) this.authoring = [...new Set([...originalAuthors, "^claude <"])];
            try {
              const commits = await originalFilter.call(this, path, options);
              if (repository) {
                selectedContributions.set(repository, commits.length);
                console.log("::notice::" + repository + " selected " + commits.length + " unique non-merge contribution commits.");
                if (!commits.length) throw new Error(repository + " has no matching contribution commits");
              }
              return commits;
            } finally {
              this.authoring = originalAuthors;
            }
          };
          // Bound first-line detection so large single-line assets cannot exhaust V8.
          // Full file sizes and commit additions are still counted by the original analyzer.
          const {open, readFile: readWholeFile} = await import("node:fs/promises");
          const linguistReader = require("/metrics/node_modules/linguist-js/dist/helpers/read-file.js");
          if (typeof linguistReader.default !== "function") throw new Error("Unsupported Linguist reader");
          linguistReader.default = async function(filename, onlyFirstLine = false) {
            if (!onlyFirstLine) return readWholeFile(filename, "utf8");
            const file = await open(filename, "r");
            try {
              const buffer = Buffer.alloc(64 * 1024);
              const {bytesRead} = await file.read(buffer, 0, buffer.length, 0);
              return buffer.subarray(0, bytesRead).toString("utf8").split(/\r?\n/, 1)[0];
            } finally {
              await file.close();
            }
          };
          
          // Verify complete analysis and report each organization repository's contribution delta.
          const originalAnalyze = IndepthAnalyzer.prototype.analyze;
          IndepthAnalyzer.prototype.analyze = async function(path, options) {
            const repository = reportedRepositories.find(repo => path === this.parse(repo).path);
            const before = repository ? {commits: this.results.commits, missed: this.results.missed.commits, stats: {...this.results.stats}, lines: {...this.results.lines}} : null;
            // Metrics replaces its color map after each repository; retain earlier languages.
            const previousColors = {...this.results.colors};
            const result = await originalAnalyze.call(this, path, options);
            this.results.colors = {...previousColors, ...Object.fromEntries(
              Object.entries(this.results.colors).filter(([, color]) => color)
            )};
            if (repository) {
              const commits = this.results.commits - before.commits;
              const missed = this.results.missed.commits - before.missed;
              const additions = Object.fromEntries(Object.entries(this.results.stats)
                .map(([language, bytes]) => [language, {bytes: bytes - (before.stats[language] || 0), lines: (this.results.lines[language] || 0) - (before.lines[language] || 0)}])
                .filter(([, value]) => value.bytes > 0));
              console.log("::notice::" + repository + " analyzed " + commits + " commits; skipped " + missed + ". Language additions: " + JSON.stringify(additions));
              if (!commits || commits !== selectedContributions.get(repository) || missed || ((claudeRepositories.includes(repository) || requiredRepositories.includes(repository)) && !Object.keys(additions).length))
                throw new Error(repository + " analysis is incomplete");
              if ((repository.endsWith("/Adroid-App") || repository === "OREUM-IT/jeju-tour-flutter") && !additions.Dart?.bytes)
                throw new Error(repository + " Dart contributions are missing");
            }
            return result;
          };
          
          // Match the official action's defaults and URI-encoded input handling.
          const {readFile} = await import("node:fs/promises");
          const {default: yaml} = await import("/metrics/node_modules/js-yaml/index.js");
          const {inputs: actionInputs} = yaml.load(await readFile("/metrics/action.yml", "utf8"));
          for (const [name, input] of Object.entries(actionInputs)) {
            const key = "INPUT_" + name.toUpperCase();
            const value = process.env[key] ?? (name === "committer_token" ? "" : input.default ?? "");
            process.env[key] = encodeURIComponent(String(value));
          }
          await import("/metrics/source/app/action/index.mjs");
          for (const repository of requiredRepositories) {
            if (!selectedContributions.has(repository)) throw new Error(repository + " was not analyzed");
          }
          METRICS_LAUNCHER

      - name: Install contribution languages card
        if: steps.lowlighter_metrics.outcome == 'success'
        run: |
          test -s "$RUNNER_TEMP/metrics-renders/top-langs.svg"
          cp "$RUNNER_TEMP/metrics-renders/top-langs.svg" profile/top-langs.svg

      - name: Report contribution analysis failure
        if: steps.lowlighter_metrics.outcome == 'failure'
        run: echo "::warning::Language analysis failed. Keeping the previous card. Check METRICS_TOKEN access and the analysis logs."

      - name: Explain personal repositories fallback
        if: >-
          env.HAS_METRICS_TOKEN != 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 0 * * *')
        run: echo "::notice::Set the METRICS_TOKEN Actions secret to enable organization contribution languages. Until then, the card includes personal repositories only."

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: profile/pin-stats-organization-github-readme-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update README cards"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
